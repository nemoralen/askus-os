name: Build ASKus OS ISO

# Builds a fresh ASKus OS image with the latest Debian security fixes and
# Tor Browser, and publishes it as a GitHub Release. ASKus OS checks this
# repository's latest release at startup and offers to update itself.
on:
  schedule:
    - cron: "17 7 * * *"      # every day 07:17 UTC (2:17 AM New York)
  workflow_dispatch:          # "Run workflow" button in the Actions tab

# The build itself can't touch the repository or the signing key. Only the "release" job
# can: it runs in the protected "release" environment (main branch only, and it waits for
# the owner's approval), which is the only place the signing key is available.
permissions:
  contents: read

concurrency:
  group: askus-build-${{ github.ref }}   # test builds of other branches never queue behind (or cancel) main's
  cancel-in-progress: false

env:
  KEEP_RELEASES: 7            # how many daily releases to keep

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    outputs:
      id: ${{ steps.ver.outputs.id }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version for this build
        id: ver
        run: |
          ID=$(date -u +%Y%m%d%H%M)
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "tag=v1.0-$ID" >> "$GITHUB_OUTPUT"
          echo "Building ASKus OS v1.0-$ID"

      - name: Check scripts (syntax)
        env:
          PYTHONDONTWRITEBYTECODE: "1"   # no __pycache__ inside includes.chroot (it would ship in the image)
        run: |
          set -e
          for f in build.sh branding/render.sh branding/src/make-logo.sh auto/* config/hooks/live/*; do bash -n "$f"; done
          for f in config/includes.chroot/usr/local/bin/* config/includes.chroot/usr/local/sbin/*; do
            if head -1 "$f" | grep -q python; then python3 -m py_compile "$f"; else bash -n "$f"; fi
          done
          echo "all scripts OK"

      - name: Free disk space on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h /

      - name: Build ISO inside Debian 13 (trixie)
        run: |
          docker run --rm --privileged -v "$PWD":/work -w /work \
            -e ASKUS_BUILD_ID="${{ steps.ver.outputs.id }}" \
            -e ASKUS_UPDATE_REPO="${{ github.repository }}" \
            debian:trixie@sha256:9c6e381421d0f48d1b8133e573f33c185ee16cbf505eda9c4a8a4791b25ea8a6 \
            bash -c "chmod +x build.sh branding/render.sh branding/src/make-logo.sh auto/* config/hooks/live/* config/includes.chroot/usr/local/bin/* config/includes.chroot/usr/local/sbin/* && apt-get update && apt-get install -y --no-install-recommends ca-certificates && ./build.sh"

      - name: Prepare release files
        run: |
          mkdir -p out
          NAME="askus-os-${{ steps.ver.outputs.id }}.iso"
          sudo mv "$(ls -1 *.iso | head -n1)" "out/$NAME"
          sudo cp build.log out/build.log || true
          sudo chown -R "$(id -u)" out
          cd out
          sha256sum "$NAME" > SHA256SUMS            # checksum of the WHOLE iso (used by the in-OS updater)
          # Fast (delta) updates: fingerprint the image in ~256 KB chunks, so installed systems
          # download only the chunks that changed and re-use the rest from their USB stick.
          gcc -O2 -o /tmp/askus-cdc ../tools/askus-cdc.c
          python3 ../tools/make-index.py "$NAME" "$NAME.index.gz" /tmp/askus-cdc
          # GitHub release files must be < 2 GiB: split if needed.
          # Rejoin on Windows: copy /b NAME.part00 + NAME.part01 NAME   |   Linux/Mac: cat NAME.part* > NAME
          if [ "$(stat -c%s "$NAME")" -gt 2000000000 ]; then
            split -b 1900M -d "$NAME" "$NAME.part"; rm "$NAME"
          fi
          ls -la

      - name: Upload ISO as workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: askus-os-iso
          path: out/*
          retention-days: 7
          compression-level: 0

  release:
    needs: build
    if: github.ref == 'refs/heads/main'   # test builds on other branches never reach the key
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: release        # protected: main only + owner approval; holds ASKUS_SIGNING_KEY
    permissions:
      contents: write           # publish the release
      actions: write            # keep the daily schedule enabled
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get the built ISO
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: askus-os-iso
          path: out

      - name: Sign the release (ASKus release key)
        # Installed ASKus systems refuse any update whose SHA256SUMS is not signed with this key.
        env:
          ASKUS_SIGNING_KEY: ${{ secrets.ASKUS_SIGNING_KEY }}
          BUILD_ID: ${{ needs.build.outputs.id }}
        run: |
          SIGNERS=config/includes.chroot/etc/askus/release-signers
          if [ ! -s "$SIGNERS" ]; then
            echo "::error::$SIGNERS is missing. Not publishing an unsigned release."
            exit 1
          fi
          # Sign only what will really be published: SHA256SUMS must list exactly this build's
          # image (the in-OS updater reads the version from that signed name) and match its bytes.
          NAME="askus-os-$BUILD_ID.iso"
          if [ "$(wc -l < out/SHA256SUMS)" != 1 ] || [ "$(awk '{print $2}' out/SHA256SUMS)" != "$NAME" ]; then
            echo "::error::SHA256SUMS does not list exactly $NAME"; exit 1
          fi
          if [ -f "out/$NAME" ]; then GOT=$(sha256sum < "out/$NAME"); else GOT=$(cat "out/$NAME".part* | sha256sum); fi
          if [ "${GOT%% *}" != "$(awk '{print $1}' out/SHA256SUMS)" ]; then
            echo "::error::SHA256SUMS does not match the image that would be published"; exit 1
          fi
          if [ -z "$ASKUS_SIGNING_KEY" ]; then
            echo "::error::$SIGNERS exists but the secret ASKUS_SIGNING_KEY is missing. Not publishing an unsigned release."
            exit 1
          fi
          umask 077
          KEYDIR=$(mktemp -d)
          printf '%s\n' "$ASKUS_SIGNING_KEY" | tr -d '\r' > "$KEYDIR/key"
          rm -f out/SHA256SUMS.sig
          ssh-keygen -q -Y sign -f "$KEYDIR/key" -n askus-release out/SHA256SUMS
          shred -u "$KEYDIR/key" 2>/dev/null || rm -f "$KEYDIR/key"
          chmod 644 out/SHA256SUMS.sig
          # make sure the key that signed matches the public key built into the OS
          ssh-keygen -Y verify -f "$SIGNERS" -I askus-release -n askus-release \
            -s out/SHA256SUMS.sig < out/SHA256SUMS
          ls -la out

      - name: Publish GitHub Release
        # Plain `gh` (preinstalled on the runner) instead of a third-party action: nothing
        # outside GitHub's own code runs with permission to publish releases.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          cat > notes.md <<EOF
          **ASKus OS $TAG**, a daily build with the latest Debian security updates and Tor Browser. Signed with the ASKus release key (\`SHA256SUMS.sig\`).

          **Already running ASKus OS?** It finds this update by itself and downloads only what changed (usually a small part of the image). Click **Update now** in the notification, or open **ASKus Update**.

          **New install:** download the \`.iso\` (if it's split into \`.part00\`/\`.part01\`, join them: Windows \`copy /b file.part00 + file.part01 file.iso\`, Mac/Linux \`cat file.part* > file.iso\`), check it against \`SHA256SUMS\`, then flash it to a USB stick with balenaEtcher.
          EOF
          gh release create "$TAG" out/*.iso* out/SHA256SUMS out/SHA256SUMS.sig \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "ASKus OS $TAG" --notes-file notes.md --latest

      - name: Keep this build's update index permanently
        # Tiny file (~1 MB). Lets a stick of ANY older version still do a fast update,
        # even after its own release has been removed.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view image-indices --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create image-indices --repo "$GITHUB_REPOSITORY" --prerelease --latest=false \
              --title "Update indices (for fast updates)" \
              --notes "Chunk fingerprints of every ASKus OS build, used by the in-OS updater to download only what changed. Not an installable release."
          fi
          gh release upload image-indices out/*.index.gz --repo "$GITHUB_REPOSITORY" --clobber

      - name: Remove old releases (keep the newest ${{ env.KEEP_RELEASES }})
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt \
            --jq 'map(select(.tagName != "image-indices")) | sort_by(.createdAt) | reverse | .[(env.KEEP_RELEASES|tonumber):] | .[].tagName' |
          while read -r t; do echo "deleting old release $t"; gh release delete "$t" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag; done

      - name: Keep the daily schedule alive
        # GitHub pauses scheduled workflows after 60 days without repository activity.
        # Re-enabling the workflow through the API keeps it running without pushing commits
        # (pushes to main are protected).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/build-iso.yml/enable" || true
