#!/usr/sbin/nft -f
# ASKus OS firewall — fail-closed: nothing leaves the machine except through Tor.
flush ruleset

table ip askus_nat {
  chain output {
    type nat hook output priority -100; policy accept;
    meta skuid "debian-tor" return                 # Tor itself talks to the network
    udp dport 53 redirect to :5353                 # every DNS lookup -> Tor DNSPort
    ip daddr 10.192.0.0/10 meta l4proto tcp redirect to :9040   # .onion (automapped)
    ip daddr 127.0.0.0/8 return                    # local services stay local
    meta l4proto tcp redirect to :9040             # all other TCP -> Tor TransPort
  }
}

table inet askus_filter {
  chain input {
    type filter hook input priority 0; policy drop;
    iif "lo" accept
    ct state established,related accept
  }
  chain forward {
    type filter hook forward priority 0; policy drop;
  }
  chain output {
    type filter hook output priority 0; policy drop;
    oif "lo" accept
    meta skuid "debian-tor" ct state new,established accept
    meta skuid 0 udp sport 68 udp dport 67 accept  # DHCP so you can get on the network
    ct state established,related accept
    limit rate 6/minute log prefix "askus-blocked: " level info
    reject
  }
}

table ip6 askus_v6 {
  chain out6 { type filter hook output priority 0; policy drop; oif "lo" accept; }
  chain in6 { type filter hook input  priority 0; policy drop; iif "lo" accept; }
}
