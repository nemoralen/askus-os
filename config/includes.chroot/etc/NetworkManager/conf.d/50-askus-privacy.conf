[main]
dns=none
hostname-mode=none

[connectivity]
enabled=false

[device]
wifi.scan-rand-mac-address=yes

[connection]
# New random MAC address every time you connect
wifi.cloned-mac-address=random
ethernet.cloned-mac-address=random
ipv4.dhcp-send-hostname=false
ipv6.method=disabled
connection.llmnr=0
connection.mdns=0
